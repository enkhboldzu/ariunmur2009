name: Node.js CI

on:
  push:
    branches: ["main"]
#  pull_request:
#    branches: [ "main" ]

jobs:
  build:
    runs-on: self-hosted

    strategy:
      matrix:
        node-version: [22.20.0]
    env:
      VUE_WEBSITE_URL: ${{secrets.VUE_WEBSITE_URL}}
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false

      # # .env is not tracked in git (real secrets live only on the server).
      # # A self-hosted runner's workspace persists across runs, so a checkout
      # # that removes a file from the tracked tree also deletes it from disk
      # # — restore it from a copy kept outside the git working tree so a
      # # missing/renamed .env in git history can never take down the app.
      # - name: Restore .env
      #   run: cp /home/user/.env.eliteBowsysMn.production .env

      # # No cache: "npm" here — this runner is self-hosted and persistent, so
      # # ~/.npm already survives between runs on local disk. Routing that
      # # through GitHub's Actions cache service was pure overhead, and that
      # # cache blob grew large enough (~618MB) to stall/hang on restore.
