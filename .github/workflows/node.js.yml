name: Node.js CI

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: self-hosted

    strategy:
      matrix:
        node-version: [22.20.0]
    env:
      VUE_WEBSITE_URL: ${{secrets.VUE_WEBSITE_URL}}
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false

      - run: npm ci

      - run: cd ./frontend/ && npm ci

      - run: cd ./frontend/ && npm run build

      - run: cd ./frontend/ && cp -r dist/ ../

      - run: pm2 restart 0
